[project]
name = "core"
version = "0.1.0"
description = "Core shared database models, heuristics, and settings for Gmail Tracker"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "crawlerdetect>=0.1.7",
    "user-agents>=2.2.0",
    "langcodes>=3.3.0",
    "language-data>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
