[project]
name = "gmail-tracker-workspace"
version = "0.1.0"
description = "Monorepo workspace for Gmail Tracker & Email Formatter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.uv.sources]
core = { workspace = true }
formatter = { workspace = true }
tracker = { workspace = true }
bot = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = [
    "packages/core/src",
    "packages/formatter/src",
    "services/tracker/src",
    "services/bot/src",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"