[project]
name = "tracker"
version = "0.1.0"
description = "FastAPI Public Tracking Gateway and API"
requires-python = ">=3.11"
dependencies = [
    "core",
    "formatter",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
