services:
  mailblinker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailblinker
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:////app/data/tracker.db
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_MODE=${TELEGRAM_BOT_MODE:-auto}
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - LOG_FILE=${LOG_FILE:-/app/logs/app.log}
